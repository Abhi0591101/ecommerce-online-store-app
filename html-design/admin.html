<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant & Super Admin Control Portal | HyperLocal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen selection:bg-indigo-600 selection:text-white">

  <!-- Top Admin Bar -->
  <header class="bg-slate-950 text-white sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2 text-white font-black text-lg">
          <div class="w-9 h-9 rounded-2xl bg-indigo-600 flex items-center justify-center font-bold text-sm">
            ⚡
          </div>
          <span>Merchant & Admin <span class="text-indigo-400">Portal</span></span>
        </a>

        <!-- Store Availability Toggle Button -->
        <button id="storeStatusToggleBtn" onclick="window.adminPortal.toggleCurrentStoreOnline()"
          class="ml-4 px-3.5 py-1.5 rounded-2xl font-bold text-xs flex items-center gap-2 transition shadow-md bg-emerald-600 text-white">
          <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
          <span>STORE IS ONLINE</span>
        </button>
      </div>

      <div class="flex items-center gap-2.5">
        <a href="driver.html" class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-bold text-xs flex items-center gap-1.5 transition border border-amber-500/40">
          <span>🛵 Rider Hub</span>
        </a>
        <a href="index.html" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs flex items-center gap-1.5 transition">
          <span>➔ Customer App</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Portal Layout -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    
    <!-- Navigation Tabs -->
    <div class="flex items-center gap-2 border-b border-slate-200 pb-3 mb-6 overflow-x-auto" id="adminTabsBar">
      <button onclick="window.adminPortal.setTab('creator_studio')" id="tabBtn_creator_studio" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-indigo-600 text-white shadow-md">
        ✨ Dynamic Creator Studio
      </button>
      <button onclick="window.adminPortal.setTab('manage_stores')" id="tabBtn_manage_stores" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        🏬 Stores Directory (<span id="storesCountBadge">0</span>)
      </button>
      <button onclick="window.adminPortal.setTab('manage_products')" id="tabBtn_manage_products" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        📦 Products Matrix (<span id="productsCountBadge">0</span>)
      </button>
      <button onclick="window.adminPortal.setTab('manage_services')" id="tabBtn_manage_services" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        🛠️ Services Hub (<span id="servicesCountBadge">0</span>)
      </button>
      <button onclick="window.adminPortal.setTab('manage_categories')" id="tabBtn_manage_categories" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        🗂️ Categories (<span id="categoriesCountBadge">0</span>)
      </button>
      <button onclick="window.adminPortal.setTab('merchant_orders')" id="tabBtn_merchant_orders" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        📦 Orders Dispatch Queue
      </button>
      <button onclick="window.adminPortal.setTab('manage_drivers')" id="tabBtn_manage_drivers" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        🛵 Fleet & Riders (<span id="driversCountBadge">0</span>)
      </button>
      <button onclick="window.adminPortal.setTab('superadmin_approvals')" id="tabBtn_superadmin_approvals" class="px-4 py-2 rounded-2xl font-bold text-xs transition bg-white hover:bg-slate-200 text-slate-700 border border-slate-200">
        👑 KYC Approvals (<span id="approvalsCountBadge" class="text-amber-600 font-black">0</span>)
      </button>
    </div>

    <!-- Tab Content -->
    <div id="adminTabContent">
      <!-- Injected via admin.js -->
    </div>
  </div>

  <!-- ================= DIRECT ADD RIDER MODAL ================= -->
  <div id="addRiderModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-150 border border-slate-100">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-2xl bg-amber-500/10 text-amber-600 flex items-center justify-center text-lg font-bold">
            🛵
          </div>
          <div>
            <h3 class="font-black text-slate-900 text-sm">Add New Delivery Rider</h3>
            <p class="text-[11px] text-slate-400">Directly onboard a delivery person to active fleet</p>
          </div>
        </div>
        <button onclick="window.adminPortal.closeAddRiderModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold">
          ✕
        </button>
      </div>

      <form onsubmit="window.adminPortal.handleAddRiderSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Rider Full Name *</label>
          <input type="text" id="adminRiderName" required placeholder="e.g. Ramesh Singh" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Mobile Phone *</label>
            <input type="tel" id="adminRiderPhone" required placeholder="9811002233" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600">
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">Initial Rating</label>
            <input type="number" step="0.1" max="5.0" min="1.0" id="adminRiderRating" value="5.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Vehicle Type *</label>
            <select id="adminRiderVehicle" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600">
              <option value="Hero Splendor (Bike)">Bike (Hero Splendor)</option>
              <option value="Honda Activa (Scooter)">Scooter (Activa)</option>
              <option value="Electric Scooter (EV)">EV Scooter</option>
              <option value="Delivery Bicycle">Bicycle</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">Plate Number *</label>
            <input type="text" id="adminRiderPlate" required placeholder="DL 3S AB 7788" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 uppercase font-mono focus:outline-none focus:ring-2 focus:ring-indigo-600">
          </div>
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">Driving License Number</label>
          <input type="text" id="adminRiderLicense" placeholder="DL-UP16-20230099" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 uppercase font-mono focus:outline-none focus:ring-2 focus:ring-indigo-600">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-xs shadow-md shadow-indigo-600/20 transition">
            ✓ Activate & Add to Live Fleet
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Load Scripts -->
  <script src="js/data.js"></script>
  <script src="js/notification.js"></script>
  <script src="js/api-service.js"></script>
  <script src="js/image-cropper.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
